name: Build & Deploy Docs to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'doc/**'
      - 'app/**'
      - 'include/**'
      - 'solver/include/**'
      - 'panelbuilder/include/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel any in-progress run so the
# latest commit is always what gets deployed.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r doc/requirements.txt
          echo "Sphinx version: $(sphinx-build --version)"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen graphviz
          echo "Doxygen version: $(doxygen --version)"

      - name: Generate Doxyfile and build XML
        run: |
          REPO="$(pwd)"
          OUT="${REPO}/build/doxygen"
          mkdir -p "${OUT}"
          echo "Substituting Doxyfile.in placeholders..."
          sed \
            -e "s|@CMAKE_PROJECT_NAME@|Aeolion|g" \
            -e "s|@CMAKE_SOURCE_DIR@|${REPO}|g" \
            -e "s|@CMAKE_BINARY_DIR@|${REPO}/build|g" \
            -e "s|@DOXYGEN_OUTPUT_DIR@|${OUT}|g" \
            doc/Doxyfile.in > "${REPO}/build/Doxyfile"
          echo "Running Doxygen..."
          doxygen "${REPO}/build/Doxyfile"
          echo "Doxygen XML:"
          ls "${OUT}/xml/" | head -5

      - name: Build Sphinx HTML
        run: |
          echo "Building Sphinx docs..."
          sphinx-build -T -b html \
            -Dbreathe_projects.Aeolion="$(pwd)/build/doxygen/xml" \
            doc/ build/sphinx
          echo "Sphinx output pages: $(find build/sphinx -name '*.html' | wc -l)"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/sphinx

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
