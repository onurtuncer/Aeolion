name: CMake-Format

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - 'CMakePresets.json'
      - '.github/workflows/cmake_format.yml'
      - '.cmake-format'
      - '.run-cmake-format'
      - 'requirements.txt'
  schedule:
    - cron: '0 5 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cmake_format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install cmakelang
        run: pip install -r requirements.txt

      - name: Run CMake Lang Format Check
        run: |
          RED='\033[0;31m'
          NC='\033[0m' # No Color
          bash .run-cmake-format
          output=$(git diff)
          if [ -n "$output" ]; then printf "${RED}CMake format error: run script './.run-cmake-format'${NC}\n"; fi
          if [ -n "$output" ]; then printf "${RED}${output}${NC}\n"; fi
          if [ -n "$output" ]; then exit 1; else exit 0; fi
