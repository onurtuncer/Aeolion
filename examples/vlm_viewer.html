  out[4]=xy; out[5]=yy; out[6]=zy; out[7]=0;
  out[8]=xz; out[9]=yz; out[10]=zz; out[11]=0;
  out[12]=-(xx*eye[0]+xy*eye[1]+xz*eye[2]);
  out[13]=-(yx*eye[0]+yy*eye[1]+yz*eye[2]);
  out[14]=-(zx*eye[0]+zy*eye[1]+zz*eye[2]);
  out[15]=1;
  return out;
}
function normalize3(v){ const l=Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; }
function cross3(a,b){ return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

// ---------------------------------------------------------------------
// Colormaps
// ---------------------------------------------------------------------
function diverging(t){ // t in [-1,1]: blue -> white -> red
  t = Math.max(-1, Math.min(1, t));
  if (t < 0){ const s = 1+t; return [s, s, 1]; }
  const s = 1-t; return [1, s, s];
}
const surfaceColors = {};
const palette = [[0.95,0.55,0.2],[0.3,0.65,0.95],[0.4,0.85,0.45],[0.85,0.4,0.85],[0.9,0.85,0.3]];
function colorForSurface(name){
  if (!(name in surfaceColors)) surfaceColors[name] = palette[Object.keys(surfaceColors).length % palette.length];
  return surfaceColors[name];
}

// ---------------------------------------------------------------------
// Build vertex/index buffers from panel quads
// ---------------------------------------------------------------------
let loadMin=Infinity, loadMax=-Infinity;
for (const p of DATA.panels){ loadMin=Math.min(loadMin,p.loading); loadMax=Math.max(loadMax,p.loading); }
const loadAbsMax = Math.max(Math.abs(loadMin), Math.abs(loadMax)) || 1;

// bounding box (for camera framing)
let bbMin=[Infinity,Infinity,Infinity], bbMax=[-Infinity,-Infinity,-Infinity];
function growBB(p){ for(let k=0;k<3;k++){ bbMin[k]=Math.min(bbMin[k],p[k]); bbMax[k]=Math.max(bbMax[k],p[k]); } }
for (const p of DATA.panels){ growBB(p.le_a); growBB(p.te_a); growBB(p.te_b); growBB(p.le_b); }
const center = [(bbMin[0]+bbMax[0])/2, (bbMin[1]+bbMax[1])/2, (bbMin[2]+bbMax[2])/2];
const extent = Math.max(bbMax[0]-bbMin[0], bbMax[1]-bbMin[1], bbMax[2]-bbMin[2]) || 1;

function buildMeshes(colorMode){
  const positions=[], normals=[], colors=[], triIndex=[], lineIndex=[];
  let vi=0;
  for (const p of DATA.panels){
    const verts = [p.le_a, p.te_a, p.te_b, p.le_b];
    let col;
    if (colorMode === 'surface') col = colorForSurface(p.surface);
    else col = diverging(p.loading/loadAbsMax);
    for (const v of verts){
      positions.push(v[0],v[1],v[2]);
      normals.push(p.normal[0],p.normal[1],p.normal[2]);
      colors.push(col[0],col[1],col[2]);
    }
    triIndex.push(vi,vi+1,vi+2, vi,vi+2,vi+3);
    lineIndex.push(vi,vi+1, vi+1,vi+2, vi+2,vi+3, vi+3,vi);
    vi += 4;
  }
  return {
    positions:new Float32Array(positions), normals:new Float32Array(normals),
    colors:new Float32Array(colors), triIndex:new Uint16Array(triIndex), lineIndex:new Uint16Array(lineIndex)
  };
}

// ---------------------------------------------------------------------
// WebGL setup
// ---------------------------------------------------------------------
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl');
if (!gl) { document.body.innerHTML = '<p style="color:white;padding:20px">WebGL not available in this browser.</p>'; }

const vsSrc = `
  attribute vec3 aPosition;
  attribute vec3 aNormal;
  attribute vec3 aColor;
  uniform mat4 uMVP;
  uniform mat4 uModel;
  varying vec3 vNormal;
  varying vec3 vColor;
  void main(){
    gl_Position = uMVP * vec4(aPosition, 1.0);
    vNormal = mat3(uModel) * aNormal;
    vColor = aColor;
  }
`;
const fsSrc = `
  precision mediump float;
  varying vec3 vNormal;
  varying vec3 vColor;
  uniform vec3 uLightDir;
  uniform float uAmbient;
  void main(){
    vec3 n = normalize(vNormal);
    float diff = max(dot(n, -uLightDir), 0.0);
    float backDiff = max(dot(-n, -uLightDir), 0.0) * 0.5;
    float lit = uAmbient + (1.0-uAmbient) * max(diff, backDiff);
    gl_FragColor = vec4(vColor * lit, 1.0);
  }
`;
const fsLineSrc = `
  precision mediump float;
  void main(){ gl_FragColor = vec4(0.05, 0.06, 0.08, 0.9); }
`;

function compileShader(src, type){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src); gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(sh));
  return sh;
}
function makeProgram(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(vs, gl.VERTEX_SHADER));
  gl.attachShader(p, compileShader(fs, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
  return p;
}
const progSolid = makeProgram(vsSrc, fsSrc);
const progLine = makeProgram(vsSrc, fsLineSrc);

function makeBuffer(target, data){
  const buf = gl.createBuffer();
  gl.bindBuffer(target, buf);
  gl.bufferData(target, data, gl.STATIC_DRAW);
  return buf;
}

let mesh = buildMeshes('loading');
let bufPos = makeBuffer(gl.ARRAY_BUFFER, mesh.positions);
let bufNorm = makeBuffer(gl.ARRAY_BUFFER, mesh.normals);
let bufCol = makeBuffer(gl.ARRAY_BUFFER, mesh.colors);
let bufTri = makeBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.triIndex);
let bufLine = makeBuffer(gl.ELEMENT_ARRAY_BUFFER, mesh.lineIndex);

function rebuildMesh(colorMode){
  mesh = buildMeshes(colorMode);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufPos); gl.bufferData(gl.ARRAY_BUFFER, mesh.positions, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufNorm); gl.bufferData(gl.ARRAY_BUFFER, mesh.normals, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufCol); gl.bufferData(gl.ARRAY_BUFFER, mesh.colors, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bufTri); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.triIndex, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bufLine); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.lineIndex, gl.STATIC_DRAW);
}

// ---------------------------------------------------------------------
// Camera state (orbit)
// ---------------------------------------------------------------------
let theta = 0.9, phi = 1.0, radius = extent*2.2;
let panX = 0, panY = 0;
let dragging = false, shiftDrag = false, lastX=0, lastY=0;

canvas.addEventListener('mousedown', e=>{ dragging=true; shiftDrag=e.shiftKey; lastX=e.clientX; lastY=e.clientY; });
window.addEventListener('mouseup', ()=> dragging=false);
window.addEventListener('mousemove', e=>{
  if (!dragging) return;
  const dx=e.clientX-lastX, dy=e.clientY-lastY; lastX=e.clientX; lastY=e.clientY;
  if (shiftDrag){ panX -= dx*radius*0.0015; panY += dy*radius*0.0015; }
  else { theta -= dx*0.01; phi = Math.max(0.05, Math.min(Math.PI-0.05, phi - dy*0.01)); }
});
canvas.addEventListener('wheel', e=>{ radius *= (1 + e.deltaY*0.001); radius = Math.max(extent*0.2, Math.min(extent*10, radius)); e.preventDefault(); }, {passive:false});
document.getElementById('resetView').onclick = ()=>{ theta=0.9; phi=1.0; radius=extent*2.2; panX=0; panY=0; };

// ---------------------------------------------------------------------
// Render loop
// ---------------------------------------------------------------------
function resize(){
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener('resize', resize);
resize();

gl.enable(gl.DEPTH_TEST);
gl.clearColor(0.07,0.08,0.10,1);

function setAttribs(prog){
  const loc = (name)=> gl.getAttribLocation(prog, name);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufPos);
  const aPos = loc('aPosition'); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufNorm);
  const aNorm = loc('aNormal'); gl.enableVertexAttribArray(aNorm); gl.vertexAttribPointer(aNorm,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, bufCol);
  const aCol = loc('aColor'); gl.enableVertexAttribArray(aCol); gl.vertexAttribPointer(aCol,3,gl.FLOAT,false,0,0);
}

function draw(){
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const eye = [
    center[0]+panX + radius*Math.sin(phi)*Math.cos(theta),
    center[1]+panY + radius*Math.cos(phi),
    center[2] + radius*Math.sin(phi)*Math.sin(theta)
  ];
  const target = [center[0]+panX, center[1]+panY, center[2]];
  const view = mat4LookAt(eye, target, [0,1,0]);
  const proj = mat4Perspective(45*Math.PI/180, canvas.width/canvas.height, extent*0.01, extent*30);
  const model = mat4Identity();
  const mvp = mat4Multiply(proj, mat4Multiply(view, model));

  const solidOn = document.getElementById('solidOn').checked;
  const wireOn = document.getElementById('wireOn').checked;

  if (solidOn){
    gl.useProgram(progSolid);
    setAttribs(progSolid);
    gl.uniformMatrix4fv(gl.getUniformLocation(progSolid,'uMVP'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progSolid,'uModel'), false, model);
    gl.uniform3fv(gl.getUniformLocation(progSolid,'uLightDir'), normalize3([-0.4,-0.7,-0.5]));
    gl.uniform1f(gl.getUniformLocation(progSolid,'uAmbient'), 0.45);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bufTri);
    gl.drawElements(gl.TRIANGLES, mesh.triIndex.length, gl.UNSIGNED_SHORT, 0);
  }
  if (wireOn){
    gl.useProgram(progLine);
    setAttribs(progLine);
    gl.uniformMatrix4fv(gl.getUniformLocation(progLine,'uMVP'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progLine,'uModel'), false, model);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, bufLine);
    gl.lineWidth(1);
    gl.drawElements(gl.LINES, mesh.lineIndex.length, gl.UNSIGNED_SHORT, 0);
  }
  requestAnimationFrame(draw);
}
draw();

// ---------------------------------------------------------------------
// UI text
// ---------------------------------------------------------------------
document.getElementById('summary').innerHTML =
  `<b>Solve summary</b><br>CL = ${DATA.summary.CL.toFixed(4)}<br>CDi = ${DATA.summary.CDi.toFixed(5)}<br>` +
  `CY = ${DATA.summary.CY.toExponential(2)}<br>S_ref = ${DATA.summary.referenceArea.toFixed(3)} m&sup2;<br>panels = ${DATA.panels.length}`;

function updateLegend(mode){
  const bar = document.getElementById('legendBar');
  if (mode === 'loading'){
    document.getElementById('legendTitle').textContent = 'Circulation loading (\u0393 / (V\u221E\u00B7c))';
    bar.style.background = 'linear-gradient(to right, rgb(0,0,255), rgb(255,255,255), rgb(255,0,0))';
    document.getElementById('legendMin').textContent = (-loadAbsMax).toFixed(3);
    document.getElementById('legendMax').textContent = (loadAbsMax).toFixed(3);
  } else {
    document.getElementById('legendTitle').textContent = 'Surface';
    const names = Object.keys(surfaceColors).length ? Object.keys(surfaceColors) : [...new Set(DATA.panels.map(p=>p.surface))];
    let grad = names.map((n,idx)=>{ const c = colorForSurface(n); return `rgb(${c[0]*255|0},${c[1]*255|0},${c[2]*255|0}) ${idx/(names.length-1||1)*100}%`; }).join(', ');
    bar.style.background = names.length>1 ? `linear-gradient(to right, ${grad})` : `rgb(${colorForSurface(names[0])[0]*255|0},${colorForSurface(names[0])[1]*255|0},${colorForSurface(names[0])[2]*255|0})`;
    document.getElementById('legendMin').textContent = names[0] || '';
    document.getElementById('legendMax').textContent = names[names.length-1] || '';
  }
}
updateLegend('loading');

document.getElementById('colorMode').addEventListener('change', (e)=>{
  rebuildMesh(e.target.value);
  updateLegend(e.target.value);
});
</script>
</body>
</html>
